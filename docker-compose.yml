services:
  postgres:
    image: postgres:16-alpine
    container_name: bulwark-dashboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_GRAFANA_PASSWORD: ${POSTGRES_GRAFANA_PASSWORD}
      POSTGRES_UMAMI_PASSWORD: ${POSTGRES_UMAMI_PASSWORD}
      POSTGRES_DASHBOARD_PASSWORD: ${POSTGRES_DASHBOARD_PASSWORD}
      POSTGRES_TELEMETRY_PASSWORD: ${POSTGRES_TELEMETRY_PASSWORD}
      # Grafana's read-only logins, set by postgres/grafana-read-only.sql.
      POSTGRES_GRAFANA_DASHBOARD_RO_PASSWORD: ${POSTGRES_GRAFANA_DASHBOARD_RO_PASSWORD}
      POSTGRES_GRAFANA_UMAMI_RO_PASSWORD: ${POSTGRES_GRAFANA_UMAMI_RO_PASSWORD}
      POSTGRES_GRAFANA_TELEMETRY_RO_PASSWORD: ${POSTGRES_GRAFANA_TELEMETRY_RO_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./postgres/grafana-read-only.sql:/docker-entrypoint-initdb.d/20-grafana-read-only.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: bulwark-dashboard-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # The relay's metrics token (deploy.sh makes the file if it is missing).
      - ./secrets/relay-metrics-token:/etc/prometheus/relay-metrics-token:ro
      - ./data/prometheus:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - bulwark

  grafana:
    image: grafana/grafana:latest
    container_name: bulwark-dashboard-grafana
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN}
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: postgres:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: grafana
      GF_DATABASE_PASSWORD: ${POSTGRES_GRAFANA_PASSWORD}
      GF_DATABASE_SSL_MODE: disable
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Grafana's own /metrics answers without a login; nothing scrapes it.
      GF_METRICS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: frser-sqlite-datasource
      # --- authentik SSO (identitaet.rathblume.de, app bulwark-grafana), 2026-09-03. Local admin login stays as break-glass. ---
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Rathblume Login
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: bulwark-grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OIDC_SECRET:?must-set}
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid email profile"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://identitaet.rathblume.de/application/o/authorize/
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://identitaet.rathblume.de/application/o/token/
      GF_AUTH_GENERIC_OAUTH_API_URL: https://identitaet.rathblume.de/application/o/userinfo/
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
      # Only people with the grafana-admin or grafana-viewer role in authentik
      # get in; anyone else the provider lets through is refused.
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(roles[*], 'grafana-admin') && 'Admin' || contains(roles[*], 'grafana-viewer') && 'Viewer'"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      # Exposed for substitution inside provisioning/datasources.yml: the
      # read-only logins, never the owners of the databases.
      POSTGRES_GRAFANA_DASHBOARD_RO_PASSWORD: ${POSTGRES_GRAFANA_DASHBOARD_RO_PASSWORD}
      POSTGRES_GRAFANA_UMAMI_RO_PASSWORD: ${POSTGRES_GRAFANA_UMAMI_RO_PASSWORD}
      POSTGRES_GRAFANA_TELEMETRY_RO_PASSWORD: ${POSTGRES_GRAFANA_TELEMETRY_RO_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./data/grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3006:3000"

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: bulwark-dashboard-umami
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_TYPE: postgresql
      DATABASE_URL: postgresql://umami:${POSTGRES_UMAMI_PASSWORD}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
      DISABLE_TELEMETRY: "1"
      # New session hash every day (Umami's default is every month), as the
      # website's privacy page promises.
      SALT_ROTATION: day
    ports:
      - "127.0.0.1:3007:3000"

networks:
  bulwark:
    external: true
