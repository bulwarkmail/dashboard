apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Dashboard (Postgres)
    uid: dashboard_pg
    type: postgres
    access: proxy
    url: postgres:5432
    user: dashboard
    secureJsonData:
      password: ${POSTGRES_DASHBOARD_PASSWORD}
    jsonData:
      database: dashboard
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    editable: false

  - name: Umami (Postgres)
    uid: umami_pg
    type: postgres
    access: proxy
    url: postgres:5432
    user: umami
    secureJsonData:
      password: ${POSTGRES_UMAMI_PASSWORD}
    jsonData:
      database: umami
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    editable: false

  - name: Telemetry (Postgres)
    uid: telemetry_pg
    type: postgres
    access: proxy
    url: postgres:5432
    user: telemetry
    secureJsonData:
      password: ${POSTGRES_TELEMETRY_PASSWORD}
    jsonData:
      database: telemetry
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    editable: false
