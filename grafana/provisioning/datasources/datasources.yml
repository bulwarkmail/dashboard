apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  # Grafana sends any SQL a signed-in user posts to a data source, so these
  # log in with roles that can only read (postgres/grafana-read-only.sql).
  # Each role takes at most 10 connections; Grafana keeps below that.
  - name: Dashboard (Postgres)
    uid: dashboard_pg
    type: postgres
    access: proxy
    url: postgres:5432
    user: grafana_dashboard_ro
    secureJsonData:
      password: ${POSTGRES_GRAFANA_DASHBOARD_RO_PASSWORD}
    jsonData:
      database: dashboard
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 8
    editable: false

  - name: Umami (Postgres)
    uid: umami_pg
    type: postgres
    access: proxy
    url: postgres:5432
    user: grafana_umami_ro
    secureJsonData:
      password: ${POSTGRES_GRAFANA_UMAMI_RO_PASSWORD}
    jsonData:
      database: umami
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 8
    editable: false

  - name: Telemetry (Postgres)
    uid: telemetry_pg
    type: postgres
    access: proxy
    url: postgres:5432
    user: grafana_telemetry_ro
    secureJsonData:
      password: ${POSTGRES_GRAFANA_TELEMETRY_RO_PASSWORD}
    jsonData:
      database: telemetry
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 8
    editable: false

  # The Warden bot's ledger (warden_runs), in the warden database the bot
  # keeps in this Postgres where it runs on the same host; without that
  # database this source fails its queries.
  - name: Warden (Postgres)
    uid: warden_pg
    type: postgres
    access: proxy
    url: postgres:5432
    user: grafana_warden_ro
    secureJsonData:
      password: ${POSTGRES_GRAFANA_WARDEN_RO_PASSWORD}
    jsonData:
      database: warden
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 8
    editable: false
