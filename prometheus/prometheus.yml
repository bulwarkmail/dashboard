global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    host: bulwarkmail

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # bulwark-relay container, joined via the external `bulwark` docker network.
  # The relay answers /metrics only with its metrics token, which
  # docker-compose.yml mounts from secrets/relay-metrics-token on the host.
  - job_name: relay
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/relay-metrics-token
    static_configs:
      - targets: ["bulwark-relay:3003"]

  # Stalwart admin endpoint exports prometheus at /metrics/prometheus.
  # Bound to localhost on the host. Wire up in phase 7.
  # - job_name: stalwart
  #   metrics_path: /metrics/prometheus
  #   static_configs:
  #     - targets: ["host.docker.internal:8080"]

  # bulwarkmail-website (pm2 on host port 3010) - /api/metrics added later.
  # - job_name: website
  #   metrics_path: /api/metrics
  #   static_configs:
  #     - targets: ["host.docker.internal:3010"]

